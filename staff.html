<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>登園届 確認(職員用)|みのべ幼稚園</title>
<style>
  body{margin:0;background:#FFFCF4;color:#3A3226;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;line-height:1.7}
  .box{padding:24px}
  .g{font-size:44px}
  button{margin-top:12px;border:none;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:bold;background:#3A3226;color:#fff;font-family:inherit}
</style>
</head>
<body>
<div class="box"><div class="g">🦒</div><div id="m">読み込み中…</div></div>
<script>
/* この画面は入れ物です。最新の画面を Apps Script から取ってきて表示します(画面の修正は Apps Script 側だけで行います) */
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbwtD8fDf_ubFphN6kj64tBin1laTfNeqz1tM4ZT9UcjgBDPi-WET2E7BPWSvJ51fXIa/exec';
  function fail(){
    document.getElementById('m').innerHTML = '読み込めませんでした。<br>電波の良い場所で、もう一度開いてください。<br><button type="button" onclick="location.reload()">再読み込み</button>';
  }
  fetch(API, { method:'POST', body: JSON.stringify({fn:'getPage', args:['staff']}), headers:{'Content-Type':'text/plain;charset=utf-8'} })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok || typeof j.result !== 'string') throw new Error(j.error || 'no page');
      document.open(); document.write(j.result); document.close();
    })
    .catch(fail);
})();
</script>
</body>
</html>
