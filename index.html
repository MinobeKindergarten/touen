<script>
/* google.script.run の代わりに、Apps Script のAPI(doPost)へ送る */
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbwtD8fDf_ubFphN6kj64tBin1laTfNeqz1tM4ZT9UcjgBDPi-WET2E7BPWSvJ51fXIa/exec';
  function mk(h){
    return new Proxy({}, { get: function(_, p){
      if(p === 'withSuccessHandler') return function(f){ return mk({s:f, f:h.f}); };
      if(p === 'withFailureHandler') return function(f){ return mk({s:h.s, f:f}); };
      return function(){
        var args = Array.prototype.slice.call(arguments);
        fetch(API, { method:'POST', body: JSON.stringify({fn:p, args:args}), headers:{'Content-Type':'text/plain;charset=utf-8'} })
          .then(function(r){ return r.json(); })
          .then(function(j){ if(j.ok){ h.s && h.s(j.result); } else { h.f && h.f(new Error(j.error)); } })
          .catch(function(){ h.f && h.f(new Error('通信できませんでした。電波の良い場所でもう一度お試しください。')); });
      };
    }});
  }
  window.google = { script: { run: mk({}) } };
})();
</script>

<style>

  input[type=text],input[type=tel],input[type=date],select,textarea{

  .grades label{display:block;text-align:center;padding:10px 0;border:2px solid var(--line);border-radius:10px;font-weight:bold;cursor:pointer;user-select:none}

  #g-chu:checked+label{background:var(--chu);border-color:var(--chu)}
  #g-sho:checked+label{background:var(--sho);border-color:var(--sho)}
  #g-ki:checked+label{background:var(--ki);border-color:var(--ki)}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

  .doc-badge.doctor{display:block;background:#FFF1E4;border:1px solid #F5CFA8}

  .done{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 18px;margin-top:16px}

  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-ih]').forEach(el => { el.innerHTML = t(el.dataset.ih); });
  document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t(el.dataset.ph); });
  if(lang!=='ja'){ document.querySelectorAll('label.f > span[data-i]:first-child, section.card h2 > span[data-i]').forEach(el => { el.insertAdjacentHTML('beforeend', `<span class="jp">${I18N.ja[el.dataset.i]}</span>`); }); }
  $('jaNote').classList.toggle('hide', lang==='ja');
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l===lang));
  const dv = sel.value, cv = clsSel.value, rv = relSel.value;
  sel.innerHTML = `<option value="">${t('choose')}</option>` + DISEASES.map(d => `<option value="${d.name}">${dName(d)}${lang!=='ja' ? ' / '+d.name : ''}</option>`).join('');
  clsSel.innerHTML = `<option value="">${t('choose')}</option>` + CLASSES.map(c => `<option value="${c.name}">${c.name}${lang!=='ja' ? ' ('+c.ro+')' : ''}</option>`).join('');
  relSel.innerHTML = '<option value="">—</option>' + RELATIONS.map(([v,tr]) => `<option value="${v}">${lang==='ja' ? v : tr[lang]+' / '+v}</option>`).join('');
  sel.value = dv; clsSel.value = cv; relSel.value = rv;
  renderCrit(); onDiseaseChange();
}

$('langs').innerHTML = LANGS.map(([l,n]) => `<button type="button" data-l="${l}">${n}</button>`).join('');
document.querySelectorAll('#langs button').forEach(b => b.onclick = () => { lang = b.dataset.l; save(lang); applyLang(); });


function renderCrit(){
  const groups = [['第二種','grp2'],['第三種','grp3'],['その他','grpOther']];
  let h = '<div class="ct">';
  groups.forEach(([k,label]) => {
    h += `<h3>${t(label)}</h3><dl>` + DISEASES.filter(d=>d.cat===k).map(d=>`<dt>${dName(d)}</dt><dd>${dCrit(d)}</dd>`).join('') + '</dl>';
  });
  h += `<h3>${t('grpNo')}</h3><dl>` + NO_LIMIT.map(d=>`<dt>${dName(d)}</dt><dd>${dCrit(d)}</dd>`).join('') + '</dl>';
  h += `<p class="hint" style="margin-top:10px">${t('cat1')}</p></div>`;
  $('critTable').innerHTML = h;
}

let files = [];

function current(){ return DISEASES.find(d => d.name === sel.value); }

function onDiseaseChange(){
  const d = current();
  $('otherWrap').classList.toggle('hide', sel.value !== 'その他');
  const badge = $('docBadge');
  badge.className = 'doc-badge';
  if(!d){ badge.innerHTML=''; $('fileCard').classList.add('hide'); $('doctorOkWrap').classList.add('hide'); $('parentNo').textContent='3'; }
  else if(d.doc === 'doctor'){
    badge.classList.add('doctor');
    const mode = SETTINGS.doctorCert;
    const k = mode === 'self' ? 'badge_self' : mode === 'optional' ? 'badge_opt' : 'badge_photo';
    badge.innerHTML = `<b>${t(k+'_b')}</b>${t(k)}`;
    $('fileCard').classList.toggle('hide', mode === 'self');
    $('fileOpt').textContent = mode === 'optional' ? t('optParen') : '';
    $('doctorOkWrap').classList.toggle('hide', mode === 'photo');
    $('doctorOkReq').textContent = mode === 'self' ? t('req') : t('req_if_nophoto');
    $('parentNo').textContent = mode === 'self' ? '3' : '4';
  } else {
    badge.classList.add('parent');
    badge.innerHTML = `<b>${t('badge_parent_b')}</b>${t('badge_parent')}`;
    $('fileCard').classList.add('hide'); $('doctorOkWrap').classList.add('hide'); $('parentNo').textContent='3';
  }
  if(d && dCrit(d)) badge.insertAdjacentHTML('beforeend', `<div class="crit-now"><b style="display:inline;font-size:14px">${t('crit_now')}</b>${dCrit(d)}</div>`);
  $('originalNote').classList.toggle('hide', !SETTINGS.needOriginal);
  const rule = d && d.rule;
  $('recoverWrap').classList.toggle('hide', !rule);
  if(rule === 'flu'){ $('recoverLabel').textContent=t('recover_flu'); $('recoverHint').textContent=t('recover_flu_hint'); }
  if(rule === 'covid'){ $('recoverLabel').textContent=t('recover_covid'); $('recoverHint').textContent=t('recover_covid_hint'); }
  checkRule();
}
sel.addEventListener('change', onDiseaseChange);

/* 日付ユーティリティ(yyyy-mm-dd) */
function addDays(s,n){ const [y,m,d]=s.split('-').map(Number); const x=new Date(Date.UTC(y,m-1,d+n)); return x.toISOString().slice(0,10); }
function fmt(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(LOCALE[lang], {month:'short', day:'numeric', weekday:'short'}); }
function maxDate(a,b){ return a>b?a:b; }

/* 学校保健安全法施行規則の出席停止期間(幼児)の目安。発症日・解熱日を0日目として数える */
let ruleNote = '';
function checkRule(){
  const box = $('ruleMsg'); ruleNote=''; box.className='notice hide';
  const d = current(); if(!d || !d.rule) return;
  const onset=$('onsetDate').value, rec=$('recoverDate').value, ret=$('returnDate').value;
  if(!onset || !rec) return;
  if(rec < onset){ box.className='notice'; box.textContent=t('rule_order'); return; }
  const earliest = d.rule==='flu' ? maxDate(addDays(onset,6), addDays(rec,4)) : maxDate(addDays(onset,6), addDays(rec,2));
  box.className = 'notice';
  if(!ret){ box.classList.add('ok'); box.textContent = t('rule_hint',{d:fmt(earliest)}); return; }
  if(ret < earliest){
    box.textContent = t('rule_early',{d:fmt(earliest)});
    ruleNote = `目安(${earliest}以降)より早い`;
  } else {
    box.classList.add('ok'); box.textContent = t('rule_ok',{d:fmt(earliest)});
  }
}
['onsetDate','recoverDate','returnDate'].forEach(id => $(id).addEventListener('change', checkRule));

/* 写真の添付(端末側で縮小してから送る) */
$('drop').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', async e => {
  for(const file of Array.from(e.target.files)){
    if(files.length >= 3) break;
    try { files.push(await prepare(file)); } catch(err){ $('err').textContent = err.message; }
  }
  e.target.value=''; renderThumbs();
});
function renderThumbs(){
  const box=$('thumbs'); box.innerHTML='';
  files.forEach((f,i)=>{
    const el=document.createElement('div'); el.className='t';
    el.innerHTML = f.preview ? `<img src="${f.preview}" alt="">` : 'PDF';
    const b=document.createElement('button'); b.type='button'; b.textContent='×'; b.onclick=()=>{files.splice(i,1);renderThumbs();};
    el.appendChild(b); box.appendChild(el);
  });
}
function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function prepare(file){
  if(file.type === 'application/pdf'){
    if(file.size > 8*1024*1024) throw new Error(t('pdf_big'));
    const url = await readAsDataURL(file);
    return { name:file.name, mimeType:'application/pdf', base64:url.split(',')[1], preview:null };
  }
  const url = await readAsDataURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error(t('img_bad'))); i.src=url; });
  const MAX=1800, s=Math.min(1, MAX/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const out=c.toDataURL('image/jpeg',0.85);
  return { name:file.name, mimeType:'image/jpeg', base64:out.split(',')[1], preview:out };
}

/* 園の設定を読み込む */
if(isGAS){
  google.script.run.withSuccessHandler(s => {
    SETTINGS = s;
    if(s.needsAccessCode) $('codeCard').classList.remove('hide');
    onDiseaseChange();
  }).getPublicSettings();
}

/* 送信 */
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const d = current();
  const g = CLASSES.find(x => x.name === clsSel.value);
  const langName = (LANGS.find(x => x[0]===lang) || ['',''])[1];
  const noteRaw = $('note').value.trim();
  const data = {
    accessCode:$('accessCode').value, docType: d ? d.doc : '',
    grade: g ? g.grade : '', className:clsSel.value,
    childName:$('childName').value.trim(), childKana:$('childKana').value.trim(),
    disease: sel.value, diseaseOther:$('diseaseOther').value.trim(),
    onsetDate:$('onsetDate').value, visitDate:$('visitDate').value, clinic:$('clinic').value.trim(),
    recoverDate: (d && d.rule) ? $('recoverDate').value : '',
    returnDate:$('returnDate').value,
    parentName:$('parentName').value.trim(), relation:relSel.value,
    phone:$('phone').value.trim(),
    note: lang==='ja' ? noteRaw : `[表示言語:${langName}] ` + noteRaw,
    agree:$('agree').checked, ruleNote,
    doctorOkDate: (d && d.doc==='doctor' && SETTINGS.doctorCert!=='photo') ? $('doctorOkDate').value : '',
    files: (d && d.doc==='doctor' && SETTINGS.doctorCert!=='self') ? files.map(f=>({name:f.name,mimeType:f.mimeType,base64:f.base64})) : [],
  };
  const miss=[];
  if(!data.className) miss.push(t('cls'));
  if(!data.childName) miss.push(t('childName'));
  if(!data.disease) miss.push(t('disease'));
  if(data.disease==='その他' && !data.diseaseOther) miss.push(t('f_diseaseOther'));
  if(!data.onsetDate) miss.push(t('onset'));
  if(!data.visitDate) miss.push(t('visit'));
  if(!data.clinic) miss.push(t('clinic'));
  if(d && d.rule && !data.recoverDate) miss.push($('recoverLabel').textContent);
  if(!data.returnDate) miss.push(t('returnDate'));
  if(d && d.doc==='doctor'){
    if(SETTINGS.doctorCert==='photo' && !data.files.length) miss.push(t('f_photo'));
    if(SETTINGS.doctorCert!=='photo' && !data.files.length && !data.doctorOkDate) miss.push(t('doctorOk'));
  }
  if(!data.parentName) miss.push(t('parentName'));
  if(!data.agree) miss.push(t('f_agree'));
  if(!$('codeCard').classList.contains('hide') && !data.accessCode) miss.push(t('f_code'));
  if(miss.length){ $('err').textContent=t('missing')+'\n・'+miss.join('\n・'); return; }
  $('err').textContent='';

  const btn=$('submitBtn'); btn.disabled=true; btn.textContent=t('sending');
  const done = res => {
    $('formArea').classList.add('hide'); $('doneArea').classList.remove('hide');
    $('receiptNo').textContent = res.receiptNo;
    $('doneOriginal').textContent = (d.doc==='doctor' && SETTINGS.needOriginal && data.files.length) ? t('done_original') : '';
    window.scrollTo(0,0);
  };
  const fail = err => { btn.disabled=false; btn.textContent=t('submit'); $('err').textContent = (lang==='ja' && err && err.message) || t('fail'); };
  if(isGAS){ google.script.run.withSuccessHandler(done).withFailureHandler(fail).submitForm(data); }
  else { setTimeout(()=>done({receiptNo:'DEMO-001'}), 600); }
});

applyLang();
</script>
